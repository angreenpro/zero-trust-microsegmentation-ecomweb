# =====================================================================
# docker-compose.yml — Kiến trúc Zero Trust & Micro-segmentation (6 Zones / 9 Subnets)
# - Phân tách mạng vi mô (Point-to-Point Micro-segments) giữa từng Zone.
# - Chặn hoàn toàn luồng Đông - Tây trái phép (catalog / auth <-> order / payment).
# - Chỉ cho phép duy nhất luồng Đông - Tây hợp lệ: order-service -> payment-service
#   qua mạng cô lập order_payment_net (kèm Xác thực Kép User JWT + X-Service-Key).
# - Toàn bộ vùng App, Payment và DB đặt internal: true (chặn Reverse Shell ra Internet).
# =====================================================================

services:
  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: Root#Lab2026
      MYSQL_DATABASE: ecommerce
    volumes:
      - ./mysql-db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql_data:/var/lib/mysql
    networks:
      db_auth_net:
        ipv4_address: 172.28.11.20
      db_catalog_net:
        ipv4_address: 172.28.12.20
      db_order_net:
        ipv4_address: 172.28.13.20
      db_payment_net:
        ipv4_address: 172.28.14.20
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-pRoot#Lab2026" ]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build: ./auth-service
    container_name: auth-service
    restart: unless-stopped
    environment:
      DB_HOST: mysql-db
      DB_PORT: "3306"
      DB_USER: auth_user
      DB_PASSWORD: Auth#Lab2026
      DB_NAME: ecommerce
      JWT_SECRET: zta-lab-super-secret-change-me
    networks:
      pep_auth_net:
        ipv4_address: 172.28.1.10
      db_auth_net:
        ipv4_address: 172.28.11.10
    depends_on:
      mysql-db:
        condition: service_healthy

  catalog-service:
    build: ./catalog-service
    container_name: catalog-service
    restart: unless-stopped
    environment:
      DB_HOST: mysql-db
      DB_PORT: "3306"
      DB_USER: catalog_user
      DB_PASSWORD: Catalog#Lab2026
      DB_NAME: ecommerce
    networks:
      pep_catalog_net:
        ipv4_address: 172.28.2.10
      db_catalog_net:
        ipv4_address: 172.28.12.10
    depends_on:
      mysql-db:
        condition: service_healthy

  payment-service:
    build: ./payment-service
    container_name: payment-service
    restart: unless-stopped
    environment:
      DB_HOST: mysql-db
      DB_PORT: "3306"
      DB_USER: payment_user
      DB_PASSWORD: Payment#Lab2026
      DB_NAME: payment_db
      JWT_SECRET: zta-lab-super-secret-change-me
      INTERNAL_SERVICE_KEY: zta-internal-order-to-payment-key-2026
    networks:
      order_payment_net:
        ipv4_address: 172.28.4.20
      db_payment_net:
        ipv4_address: 172.28.14.10
    depends_on:
      mysql-db:
        condition: service_healthy

  order-service:
    build: ./order-service
    container_name: order-service
    restart: unless-stopped
    environment:
      DB_HOST: mysql-db
      DB_PORT: "3306"
      DB_USER: order_user
      DB_PASSWORD: Order#Lab2026
      DB_NAME: order_db
      JWT_SECRET: zta-lab-super-secret-change-me
      PAYMENT_SERVICE_URL: http://payment-service:8004
      INTERNAL_SERVICE_KEY: zta-internal-order-to-payment-key-2026
    networks:
      pep_order_net:
        ipv4_address: 172.28.3.10
      order_payment_net:
        ipv4_address: 172.28.4.10
      db_order_net:
        ipv4_address: 172.28.13.10
    depends_on:
      mysql-db:
        condition: service_healthy
      payment-service:
        condition: service_started

  nginx-gateway:
    image: nginx:1.27-alpine
    container_name: nginx-gateway
    restart: unless-stopped
    ports:
      - "8086:80"
    volumes:
      - ./nginx-gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web:/usr/share/nginx/html:ro
    networks:
      edge_public_net:
        ipv4_address: 172.28.0.10
      pep_auth_net:
        ipv4_address: 172.28.1.2
      pep_catalog_net:
        ipv4_address: 172.28.2.2
      pep_order_net:
        ipv4_address: 172.28.3.2
    depends_on:
      - auth-service
      - catalog-service
      - order-service

networks:
  # 1. Mạng biên duy nhất được phép giao tiếp với Host / Internet qua cổng 8086
  edge_public_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

  # --- CÁC PHÂN ĐOẠN MẠNG PEP <-> APP (Cô lập nội bộ: internal: true) ---
  pep_auth_net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.1.0/24

  pep_catalog_net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.2.0/24

  pep_order_net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.3.0/24

  # --- PHÂN ĐOẠN MẠNG ĐÔNG - TÂY DUY NHẤT: ORDER <-> PAYMENT (PCI-DSS Zone) ---
  order_payment_net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.4.0/24

  # --- CÁC PHÂN ĐOẠN MẠNG APP/PAYMENT <-> DB (Cô lập nội bộ: internal: true) ---
  db_auth_net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.11.0/24

  db_catalog_net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.12.0/24

  db_order_net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.13.0/24

  db_payment_net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.14.0/24
 
volumes:
  mysql_data:
