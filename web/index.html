<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ZTA Shop - Lab Micro-segmentation & Payment Zone</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen">

  <!-- ===== KHU VỰC TRÊN CÙNG: ĐĂNG NHẬP ===== -->
  <header class="bg-slate-900 text-white">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <h1 class="text-xl font-bold">🛒 ZTA Shop</h1>
        <span class="text-xs bg-emerald-700/80 px-2.5 py-0.5 rounded-full">6 Zones · Multi-DB Isolated</span>
      </div>

      <!-- Form đăng nhập (ẩn khi đã đăng nhập) -->
      <form id="loginForm" class="flex flex-wrap gap-2 items-center">
        <input id="username" type="text" placeholder="Username" value="customer1"
               class="px-3 py-1.5 rounded text-slate-900 text-sm w-32" required />
        <input id="password" type="password" placeholder="Password" value="Customer@123"
               class="px-3 py-1.5 rounded text-slate-900 text-sm w-32" required />
        <button type="submit" class="bg-emerald-500 hover:bg-emerald-600 px-4 py-1.5 rounded text-sm font-semibold">
          Đăng nhập
        </button>
        <span id="loginError" class="text-red-400 text-sm"></span>
      </form>

      <!-- Trạng thái đã đăng nhập -->
      <div id="loggedInBox" class="hidden flex items-center gap-3 text-sm">
        <span>Xin chào, <b id="loggedInUser"></b> (<span id="loggedInRole"></span>)</span>
        <button id="logoutBtn" class="bg-red-500 hover:bg-red-600 px-3 py-1.5 rounded font-semibold">Đăng xuất</button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-3 gap-6">

    <!-- ===== KHU VỰC GIỮA: LƯỚI SẢN PHẨM ===== -->
    <section class="lg:col-span-2">
      <div class="flex gap-2 mb-4">
        <input id="searchBox" type="text" placeholder="Tìm sản phẩm..."
               class="flex-1 px-3 py-2 rounded border border-slate-300 text-sm" />
        <button id="searchBtn" class="bg-slate-800 text-white px-4 py-2 rounded text-sm">Tìm</button>
        <button id="reloadBtn" class="bg-slate-200 px-4 py-2 rounded text-sm">Tất cả</button>
      </div>
      <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
    </section>

    <!-- ===== KHU VỰC BÊN CẠNH: GIỎ HÀNG + PAYMENT ===== -->
    <aside class="bg-white rounded-lg shadow p-4 h-fit sticky top-4">
      <h2 class="font-bold text-lg mb-3">Giỏ hàng & Thanh toán</h2>
      <div id="cartItems" class="space-y-2 mb-3 text-sm text-slate-700">
        <p class="text-slate-400 italic">Giỏ hàng trống</p>
      </div>

      <!-- ===== KHU VỰC VÍ & PHƯƠNG THỨC THANH TOÁN (PAYMENT-SERVICE / payment_db) ===== -->
      <div class="border-t pt-3 mt-3">
        <label class="block text-xs font-semibold text-slate-600 mb-1.5">💳 Ví & Thẻ của tôi (`payment_db`)</label>

        <!-- Thông tin Ví (tải từ bảng payment_db.user_wallets qua payment-service) -->
        <div id="walletBox" class="bg-slate-800 text-white rounded-md p-2.5 mb-2 text-xs space-y-1">
          <p class="text-slate-300 italic">Đăng nhập để xem số dư Ví & Thẻ liên kết</p>
        </div>

        <select id="paymentMethod" class="w-full px-2.5 py-1.5 rounded border border-slate-300 text-xs mb-2">
          <option value="credit_card">Thẻ tín dụng / Quốc tế (PCI-DSS Masked)</option>
          <option value="vietqr">Chuyển khoản nhanh VietQR Napas</option>
          <option value="cod">Thanh toán khi nhận hàng (COD)</option>
        </select>
        <div id="cardBox">
          <input id="cardNumber" type="text" value="4111-2222-3333-4242"
                 placeholder="Số thẻ (chỉ lưu 4 số cuối tại payment-service)"
                 class="w-full px-2.5 py-1.5 rounded border border-slate-300 text-xs font-mono" />
        </div>
      </div>

      <!-- ===== TỔNG TIỀN CHI TIẾT ===== -->
      <div class="border-t pt-3 mt-3 space-y-1 text-sm">
        <div class="flex justify-between font-bold text-base pt-1">
          <span>Tổng thanh toán</span>
          <span id="cartTotal" class="text-emerald-700">0 đ</span>
        </div>
      </div>

      <button id="checkoutBtn"
              class="mt-3 w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded font-semibold">
        Thanh toán ngay
      </button>
      <div id="checkoutMsg" class="text-sm mt-2"></div>

      <!-- ===== LỊCH SỬ ĐƠN HÀNG (GET /api/orders/my-orders từ order_db) ===== -->
      <button id="myOrdersBtn"
              class="mt-4 w-full bg-slate-100 hover:bg-slate-200 text-slate-700 py-2 rounded text-sm font-semibold">
        Xem đơn hàng của tôi
      </button>
      <div id="myOrdersBox" class="hidden mt-3 border-t pt-3 space-y-2 text-sm max-h-72 overflow-y-auto"></div>
    </aside>
  </main>

<script>
// ----------------------------------------------------------------
// Toàn bộ request từ trình duyệt đi qua Nginx Gateway (/api/...).
// - order-service kết nối tới database `order_db` (orders, order_items).
// - payment-service nằm ở vùng sâu (Deep Internal Zone) và kết nối tới
//   database `payment_db` (user_wallets, payments).
// ----------------------------------------------------------------
let cart = []; // [{id, name, price, quantity}]

function money(n) {
  return Number(n || 0).toLocaleString("vi-VN") + " đ";
}

function getToken() {
  return localStorage.getItem("jwt_token");
}

function getTotal() {
  return cart.reduce((sum, i) => sum + i.price * i.quantity, 0);
}

function updateAuthUI() {
  const token = getToken();
  if (token) {
    document.getElementById("loginForm").classList.add("hidden");
    document.getElementById("loggedInBox").classList.remove("hidden");
    document.getElementById("loggedInUser").textContent = localStorage.getItem("username") || "";
    document.getElementById("loggedInRole").textContent = localStorage.getItem("role") || "";
    loadWallet();
  } else {
    document.getElementById("loginForm").classList.remove("hidden");
    document.getElementById("loggedInBox").classList.add("hidden");
    document.getElementById("walletBox").innerHTML =
      '<p class="text-slate-300 italic">Đăng nhập để xem số dư Ví & Thẻ liên kết</p>';
  }
}

async function loadWallet() {
  const token = getToken();
  const box = document.getElementById("walletBox");
  if (!token) return;
  try {
    const res = await fetch("/api/orders/wallet", {
      headers: { Authorization: "Bearer " + token },
    });
    if (!res.ok) throw new Error("Không tải được ví");
    const data = await res.json();
    const w = data.wallet;
    if (!w) return;
    box.innerHTML = `
      <div class="flex justify-between items-center">
        <span class="font-semibold text-emerald-400">${w.bank_name}</span>
        <span class="px-1.5 py-0.5 rounded bg-emerald-900/80 text-emerald-300 text-[10px] uppercase">${w.status}</span>
      </div>
      <div class="font-mono text-[11px] text-slate-300">${w.card_holder} · ${w.card_masked}</div>
      <div class="flex justify-between items-baseline pt-1 border-t border-slate-700">
        <span class="text-slate-400">Số dư khả dụng:</span>
        <span class="font-bold text-sm text-emerald-400">${money(w.balance)}</span>
      </div>
    `;
  } catch (_) {
    box.innerHTML = '<p class="text-red-300">Không kết nối được Ví Payment Zone</p>';
  }
}

// Ẩn/hiện ô nhập thẻ khi đổi phương thức thanh toán
document.getElementById("paymentMethod").addEventListener("change", (e) => {
  const cardBox = document.getElementById("cardBox");
  if (e.target.value === "credit_card") {
    cardBox.classList.remove("hidden");
  } else {
    cardBox.classList.add("hidden");
  }
});

// ----- ĐĂNG NHẬP -----
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;
  const errBox = document.getElementById("loginError");
  errBox.textContent = "";
  try {
    const res = await fetch("/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || "Đăng nhập thất bại");
    }
    const data = await res.json();
    localStorage.setItem("jwt_token", data.access_token);
    localStorage.setItem("username", username);
    localStorage.setItem("role", data.role);
    updateAuthUI();
  } catch (err) {
    errBox.textContent = err.message;
  }
});

document.getElementById("logoutBtn").addEventListener("click", () => {
  localStorage.removeItem("jwt_token");
  localStorage.removeItem("username");
  localStorage.removeItem("role");
  updateAuthUI();
});

// ----- SẢN PHẨM -----
async function loadProducts() {
  const res = await fetch("/api/products");
  const data = await res.json();
  renderProducts(data.products || []);
}

async function searchProducts() {
  const q = document.getElementById("searchBox").value;
  const res = await fetch("/api/products/search?q=" + encodeURIComponent(q));
  const data = await res.json();
  renderProducts(data.products || []);
}

// Ánh xạ trực tiếp từng sản phẩm tới file ảnh thật trong thư mục web/images/
const PRODUCT_IMAGES = {
  1: "/images/laptop.jpg",
  2: "/images/dienthoai.jpg",
  3: "/images/headphone.jpg",
  4: "/images/keyboarf.jpg",
  5: "/images/chuot.jpg",
  6: "/images/manhinh.jpg",
  7: "/images/ssd.jpg",
  8: "/images/webcam.jpg",
  9: "/images/loa.jpg",
  10: "/images/router.jpg",
};

function getProductImage(p) {
  if (p.image_url && p.image_url.startsWith("/images/")) {
    return p.image_url;
  }
  return PRODUCT_IMAGES[p.id] || p.image_url || "/images/laptop.jpg";
}

function renderProducts(products) {
  const grid = document.getElementById("productGrid");
  grid.innerHTML = "";
  if (products.length === 0) {
    grid.innerHTML = '<p class="text-slate-400 italic">Không tìm thấy sản phẩm nào.</p>';
    return;
  }
  products.forEach((p) => {
    const card = document.createElement("div");
    card.className = "bg-white rounded-lg shadow p-3 flex flex-col";
    const imgSrc = getProductImage(p);
    card.innerHTML = `
      <img src="${imgSrc}" alt="${p.name}"
           class="rounded mb-2 h-40 object-contain bg-slate-50 w-full" />
      <h3 class="font-semibold text-sm mb-1">${p.name}</h3>
      <p class="text-emerald-700 font-bold">${money(p.price)}</p>
      <p class="text-xs text-slate-400 mb-2">Còn ${p.stock} sản phẩm</p>
      <button class="mt-auto bg-slate-800 text-white text-sm py-1.5 rounded hover:bg-slate-700">
        Thêm vào giỏ
      </button>
    `;
    card.querySelector("button").addEventListener("click", () => addToCart(p));
    grid.appendChild(card);
  });
}

function updateTotalsUI() {
  document.getElementById("cartTotal").textContent = money(getTotal());
}

// ----- GIỎ HÀNG -----
function addToCart(product) {
  const existing = cart.find((i) => i.id === product.id);
  if (existing) {
    existing.quantity += 1;
  } else {
    cart.push({ id: product.id, name: product.name, price: product.price, quantity: 1 });
  }
  renderCart();
}

function renderCart() {
  const box = document.getElementById("cartItems");
  if (cart.length === 0) {
    box.innerHTML = '<p class="text-slate-400 italic">Giỏ hàng trống</p>';
  } else {
    box.innerHTML = cart
      .map(
        (i, idx) => `<div class="flex items-center justify-between gap-2">
                  <span class="flex-1">${i.name}</span>
                  <div class="flex items-center gap-1">
                    <button data-idx="${idx}" class="cart-dec w-5 h-5 bg-slate-200 rounded text-xs">-</button>
                    <span class="w-5 text-center">${i.quantity}</span>
                    <button data-idx="${idx}" class="cart-inc w-5 h-5 bg-slate-200 rounded text-xs">+</button>
                  </div>
                  <span class="w-20 text-right">${money(i.price * i.quantity)}</span>
                  <button data-idx="${idx}" class="cart-remove text-red-500 text-xs">✕</button>
                </div>`
      )
      .join("");
    box.querySelectorAll(".cart-inc").forEach((btn) =>
      btn.addEventListener("click", () => { cart[+btn.dataset.idx].quantity += 1; renderCart(); })
    );
    box.querySelectorAll(".cart-dec").forEach((btn) =>
      btn.addEventListener("click", () => {
        const item = cart[+btn.dataset.idx];
        item.quantity -= 1;
        if (item.quantity <= 0) cart.splice(+btn.dataset.idx, 1);
        renderCart();
      })
    );
    box.querySelectorAll(".cart-remove").forEach((btn) =>
      btn.addEventListener("click", () => { cart.splice(+btn.dataset.idx, 1); renderCart(); })
    );
  }
  updateTotalsUI();
}

// ----- THANH TOÁN (ORDER-SERVICE [order_db] -> PAYMENT-SERVICE [payment_db]) -----
document.getElementById("checkoutBtn").addEventListener("click", async () => {
  const msg = document.getElementById("checkoutMsg");
  msg.innerHTML = "";
  const token = getToken();
  if (!token) {
    msg.className = "text-sm mt-2 text-red-600";
    msg.textContent = "Bạn cần đăng nhập trước khi đặt hàng.";
    return;
  }
  if (cart.length === 0) {
    msg.className = "text-sm mt-2 text-red-600";
    msg.textContent = "Giỏ hàng đang trống.";
    return;
  }

  const paymentMethod = document.getElementById("paymentMethod").value;
  const cardNumber = document.getElementById("cardNumber").value;

  try {
    const res = await fetch("/api/orders", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + token,
      },
      body: JSON.stringify({
        items: cart.map((i) => ({ product_id: i.id, quantity: i.quantity })),
        payment_method: paymentMethod,
        card_number: cardNumber,
      }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || "Đặt hàng thất bại");
    }
    const data = await res.json();
    const pay = data.payment || {};
    msg.className = "text-xs mt-2 bg-emerald-50 border border-emerald-200 text-emerald-800 p-2.5 rounded space-y-1";
    msg.innerHTML = `
      <div class="font-bold text-sm">✅ Thanh toán thành công đơn #${data.order_id}</div>
      <div>• Tổng thanh toán: <b class="text-emerald-700">${money(data.total_price)}</b></div>
      <div class="border-t border-emerald-200 pt-1 mt-1 text-[11px] font-mono text-slate-600">
        [Payment Zone · payment_db] Mã GD: <b>${pay.transaction_ref || "N/A"}</b> | PTTT: <b>${pay.card_masked || pay.payment_method || ""}</b>
        ${pay.balance_after !== undefined ? `<br/>Số dư Ví còn lại: <b class="text-emerald-700">${money(pay.balance_after)}</b>` : ""}
      </div>
    `;
    cart = [];
    renderCart();
    loadProducts();
    loadWallet();
  } catch (err) {
    msg.className = "text-sm mt-2 text-red-600";
    msg.textContent = err.message;
  }
});

// ----- LỊCH SỬ ĐƠN HÀNG & TRA CỨU BIÊN LAI PAYMENT-SERVICE -----
document.getElementById("myOrdersBtn").addEventListener("click", async () => {
  const box = document.getElementById("myOrdersBox");
  const token = getToken();
  if (!token) {
    alert("Bạn cần đăng nhập trước.");
    return;
  }
  if (!box.classList.contains("hidden")) {
    box.classList.add("hidden");
    return;
  }
  box.classList.remove("hidden");
  box.innerHTML = '<p class="text-slate-400 italic">Đang tải...</p>';
  try {
    const res = await fetch("/api/orders/my-orders", {
      headers: { Authorization: "Bearer " + token },
    });
    if (!res.ok) throw new Error("Không lấy được lịch sử đơn hàng");
    const data = await res.json();
    if (!data.orders || data.orders.length === 0) {
      box.innerHTML = '<p class="text-slate-400 italic">Chưa có đơn hàng nào.</p>';
      return;
    }
    box.innerHTML = data.orders
      .map(
        (o) => `<div class="border-b pb-2 space-y-1">
                  <div class="flex justify-between items-center">
                    <span class="font-semibold">#${o.id} <span class="text-xs px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-700">${o.status}</span></span>
                    <span class="font-bold text-slate-800">${money(o.total_price)}</span>
                  </div>
                  <button data-order-id="${o.id}" class="view-receipt-btn text-xs text-indigo-600 hover:underline">
                    🔍 Xem biên lai Payment Zone (payment_db)
                  </button>
                  <div id="receipt-${o.id}" class="hidden text-[11px] font-mono bg-slate-50 p-1.5 rounded border text-slate-600"></div>
                </div>`
      )
      .join("");

    box.querySelectorAll(".view-receipt-btn").forEach((btn) =>
      btn.addEventListener("click", async () => {
        const oid = btn.dataset.orderId;
        const rBox = document.getElementById(`receipt-${oid}`);
        if (!rBox.classList.contains("hidden")) {
          rBox.classList.add("hidden");
          return;
        }
        rBox.classList.remove("hidden");
        rBox.textContent = "Đang truy vấn payment-service...";
        try {
          const r = await fetch(`/api/orders/${oid}/payment`, {
            headers: { Authorization: "Bearer " + getToken() },
          });
          const pData = await r.json();
          if (!r.ok || !pData.payment) throw new Error(pData.detail || "Không tìm thấy biên lai");
          const p = pData.payment;
          rBox.innerHTML = `Mã GD: <b>${p.transaction_ref}</b><br/>Thẻ/PTTT: <b>${p.card_masked}</b> (${p.payment_method})<br/>Số tiền: <b>${money(p.amount)}</b> | TT: <b>${p.status}</b>`;
        } catch (e) {
          rBox.textContent = e.message;
        }
      })
    );
  } catch (err) {
    box.innerHTML = `<p class="text-red-600">${err.message}</p>`;
  }
});

document.getElementById("searchBtn").addEventListener("click", searchProducts);
document.getElementById("reloadBtn").addEventListener("click", loadProducts);
document.getElementById("searchBox").addEventListener("keydown", (e) => {
  if (e.key === "Enter") searchProducts();
});

// Khởi tạo
updateAuthUI();
loadProducts();
</script>
</body>
</html>
