# nginx-gateway (Cổng 80 trong container, map ra 8080 trên host)
# Đóng vai trò Policy Enforcement Point (PEP) trong lab ZTA: toàn bộ truy cập
# từ bên ngoài đi qua một cửa duy nhất rồi mới được chuyển tiếp vào các
# microservice phía sau - đây chính là luồng Bắc - Nam (North-South Traffic).

server {
    listen 80;
    server_name localhost;

    # / -> trả về giao diện index.html
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }

    # /api/auth/* -> auth-service:8001
    location /api/auth/ {
        proxy_pass http://auth-service:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    # /api/products/* -> catalog-service:8002
    location /api/products/ {
        proxy_pass http://catalog-service:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    # GET /api/products (không có dấu / cuối) cũng phải khớp route trên
    location = /api/products {
        proxy_pass http://catalog-service:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # /api/orders/* -> order-service:8003
    location /api/orders/ {
        proxy_pass http://order-service:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }
    location = /api/orders {
        proxy_pass http://order-service:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }
}
